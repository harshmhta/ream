name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # XcodeGen emits a modern project format (objectVersion 77) that the
      # runner's *default* Xcode (15.4) cannot read. Select the newest Xcode
      # installed on the image so the generated project opens.
      - name: Select latest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then latest="/Applications/Xcode.app"; fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # `ReamCore` is a SwiftPM package, and the app scheme only carries the
      # `ReamTests` bundle — `xcodebuild test` never runs the package's own test
      # target. Run it directly, before the (slower) app build, so a regression in
      # the portable core (compression, conversion, search, text reflow) fails the
      # build instead of landing unnoticed.
      - name: Test ReamCore package
        run: swift test --package-path ReamCore

      # CI runners have no signing identity, so build/test ad-hoc ("Sign to Run
      # Locally"). Unit tests run headlessly and reliably under ad-hoc signing.
      # UI tests require a real signing identity to inject their bundle, so they
      # are excluded here and run locally instead.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Ream \
            -destination "platform=macOS" \
            -resultBundlePath build/ReamTests.xcresult \
            -only-testing:ReamTests \
            clean build test \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/ReamTests.xcresult
          retention-days: 14
          if-no-files-found: warn
