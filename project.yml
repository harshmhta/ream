name: Ream
options:
  bundleIdPrefix: com.ream
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc sign everything ("Sign to Run Locally") with no team, so the app,
    # unit-test bundle, and UI-test runner all share identical signing. A team
    # mismatch here makes the UI test bundle fail to inject. CI has no signing
    # identity, so ad-hoc is also what runs there.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    # Universal binary — Apple silicon first, Intel supported.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: YES

packages:
  ReamCore:
    path: ReamCore

targets:
  Ream:
    type: application
    platform: macOS
    sources:
      - path: Ream
        excludes:
          - "**/*.md"
    dependencies:
      - package: ReamCore
        product: ReamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ream.app
        PRODUCT_NAME: Ream
        INFOPLIST_FILE: Ream/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ream/Resources/Ream.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  ReamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ReamTests
        excludes:
          - "Fixtures/**"
      - path: ReamTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Ream
      - package: ReamCore
        product: ReamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ream.app.tests
        GENERATE_INFOPLIST_FILE: YES

  ReamUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - ReamUITests
    dependencies:
      - target: Ream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ream.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ream

schemes:
  Ream:
    build:
      targets:
        Ream: all
        ReamTests: [test]
        ReamUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ReamTests
        - ReamUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
